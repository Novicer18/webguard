<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WebGuard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-secondary">
      <div class="container">
        <a class="navbar-brand fw-bold" href="/">WebGuard</a>
        <div class="ms-auto d-flex align-items-center gap-3">
          <button class="btn btn-sm btn-outline-light" id="theme-toggle" type="button">Toggle Theme</button>
          {% if user.is_authenticated %}
            <span class="text-light small">{{ user.username }}</span>
            <form method="post" action="{% url 'accounts:logout' %}" class="m-0">
              {% csrf_token %}
              <button class="btn btn-sm btn-outline-danger" type="submit">Logout</button>
            </form>
          {% endif %}
        </div>
      </div>
    </nav>

    <main class="container py-4">
      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
      <div class="alert alert-warning small">Only scan websites you own or have permission to test.</div>
      {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/app.js"></script>
  </body>
</html>
