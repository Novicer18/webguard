{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card app-card">
      <div class="card-body p-4">
        <h4 class="card-title mb-2">Sign in</h4>
        <p class="text-secondary small mb-4">Access your cyber defense dashboard and continue monitoring your assets.</p>
        <form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-info w-100 fw-semibold" type="submit">Login</button></form>
        <p class="mt-3 small">No account? <a href="{% url 'accounts:register' %}">Register</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
