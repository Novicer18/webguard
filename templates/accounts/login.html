{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card bg-dark border-secondary">
      <div class="card-body">
        <h4 class="card-title mb-3">Sign in</h4>
        <form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary w-100" type="submit">Login</button></form>
        <p class="mt-3 small">No account? <a href="{% url 'accounts:register' %}">Register</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
