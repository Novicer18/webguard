{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card bg-dark border-secondary">
      <div class="card-body">
        <h4 class="card-title mb-3">Create account</h4>
        <form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-success w-100" type="submit">Register</button></form>
        <p class="mt-3 small">Already have an account? <a href="{% url 'accounts:login' %}">Login</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
